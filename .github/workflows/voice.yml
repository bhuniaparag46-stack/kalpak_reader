name: বাংলা কণ্ঠ-মডেল

on:
  push:
    branches: [main]
    paths: ['voice/**', '.github/workflows/voice.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        id: model
        with:
          path: work/bn
          key: indic-tts-bn-v1
      - name: মূল মডেল নামানো
        if: steps.model.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download v1-checkpoints-release -R AI4Bharat/Indic-TTS -p 'bn.zip'
          unzip -q bn.zip && rm bn.zip
      - name: পাইথন লাইব্রেরি
        run: |
          pip install --quiet torch==2.1.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "numpy<2" TTS==0.22.0 onnx onnxruntime onnxscript
          pip list 2>/dev/null | grep -iE "^(torch|TTS|onnx|numpy|trainer|coqpit) "
      - name: রূপান্তর ও যাচাই
        run: |
          if [ -f voice/export.py ]; then python voice/export.py work out; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-out
          path: out
          if-no-files-found: ignore
